<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Guitar Chords for Every Key · Dibidup Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#121110;--panel:#1e1c19;--fg:#f2eadb;--muted:#8f8676;--line:#34302a;--cell:#2a2723;--accent:#c9a25a;--accent-fg:#121110;
--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--fg)}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font:700 26px/1 var(--display);letter-spacing:1px;text-transform:uppercase}
header h1 b{color:var(--accent)}
header p{margin:5px 0 0;font-size:13px;color:var(--muted)}
.roots{display:flex;gap:6px;overflow-x:auto;padding:14px 12px 6px;scrollbar-width:none}
.roots::-webkit-scrollbar{display:none}
.roots button{flex:0 0 auto;min-width:46px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 19px var(--display);cursor:pointer}
.roots button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.types{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 10px}
.types button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;padding:6px 12px;font:500 16px var(--display);cursor:pointer}
.types button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{margin:4px 12px 14px;padding:16px 14px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title h2{margin:0;font:700 44px/1 var(--display)}
.title span{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:5px;margin:10px 0 2px;flex-wrap:wrap}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:1px 10px;font:700 15px var(--display)}
.chip.r{background:var(--accent);color:var(--accent-fg)}
.notes{font-size:15px;color:var(--muted);margin:6px 0 8px;letter-spacing:.3px}
.shapes{display:flex;gap:10px;overflow-x:auto;padding:6px 0 4px}
.shape{flex:0 0 auto;background:var(--cell);border-radius:14px;padding:10px 8px 10px;border:2px solid transparent;cursor:pointer;text-align:center}
.shape.on{border-color:var(--accent)}
.shape small.alt{color:var(--accent);letter-spacing:.3px}
.shape small{display:block;font:700 12px var(--display);color:var(--muted);letter-spacing:1px;margin-top:3px}
.ctrl{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.ctrl button{flex:1 1 140px;height:50px;border-radius:25px;border:none;background:var(--accent);color:var(--accent-fg);font:700 19px var(--display);letter-spacing:.5px;cursor:pointer}
.ctrl button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 2px}
svg .lit{fill:#ffd98a !important;filter:drop-shadow(0 0 5px rgba(255,200,90,.9))}
svg .litr{stroke:#ffd98a !important;filter:drop-shadow(0 0 4px rgba(255,200,90,.9))}
.tabs{display:flex;gap:0;margin:12px 12px 0;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.tabs button{flex:1;height:44px;padding:0 4px;border:none;background:var(--panel);color:var(--fg);font:700 18px var(--display);letter-spacing:.5px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-fg)}
.sel{display:flex;gap:8px;padding:12px 12px 0;flex-wrap:wrap}
.sel select{flex:1 1 140px;height:44px;border-radius:12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);font:600 17px var(--body);padding:0 10px}
.kc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:10px 0 4px}
.kc div{background:var(--cell);border-radius:10px;padding:6px 2px;text-align:center;border-top:4px solid var(--line)}
.kc div.T{border-top-color:#8f8676}.kc div.S{border-top-color:#c9a25a}.kc div.D{border-top-color:#f2eadb}
.kc b{display:block;font:700 13px var(--display);color:var(--muted)}.kc span{font:700 14px var(--display);overflow-wrap:anywhere;line-height:1.05;display:block}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.plist button{text-align:left;background:var(--cell);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:600 16px var(--body);cursor:pointer}
.plist button.on{border-color:var(--accent)}
.plist small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.bars div{background:var(--cell);border:1px solid var(--line);border-radius:10px;height:50px;display:flex;align-items:center;justify-content:center;font:700 21px var(--display)}
.bars div.now{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stage{display:flex;gap:14px;align-items:center;justify-content:center;margin:8px 0}
.stage .big{text-align:center}.stage .big h3{margin:0 0 4px;font:700 34px var(--display)}
.stage .next{color:var(--muted);font:600 15px var(--body);text-align:center}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.row label{font-size:14px;color:var(--muted)}.row input[type=range]{flex:1;accent-color:#c9a25a}
.beat{display:flex;gap:6px;justify-content:center;margin:6px 0}.beat i{width:12px;height:12px;border-radius:50%;background:var(--line)}.beat i.on{background:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:12px 18px;border-radius:14px;font:700 16px var(--body);z-index:9000;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.roots button.lk,.sel option.lk{opacity:.45}
.lock{margin:12px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--accent);text-align:center}
.lock h3{margin:0 0 6px;font:700 24px var(--display);color:var(--accent)}.lock p{margin:6px 0 12px;color:var(--fg);font-size:15px;line-height:1.4}
.lock button{height:48px;border-radius:24px;border:none;background:var(--accent);color:var(--accent-fg);font:700 18px var(--display);padding:0 22px;cursor:pointer}
.strs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0}
.strs button{height:92px;border-radius:14px;border:1px solid var(--line);background:var(--cell);color:var(--fg);font:700 30px var(--display);cursor:pointer}
.strs button small{display:block;font:500 12px var(--body);color:var(--muted)}
.strs button.on{background:var(--accent);color:var(--accent-fg)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 26px}
</style>
</head>

// ---------------- audio: cuerda pulsada (Karplus-Strong) generada en el navegador
let AC = null; const cache = {};
function ac(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); return AC; }
function pluck(midi){
  if (cache[midi]) return cache[midi];
  const ctx = ac(), sr = ctx.sampleRate, f = 440*Math.pow(2,(midi-69)/12), dur = 3.2;
  const buf = ctx.createBuffer(1, Math.floor(sr*dur), sr), d = buf.getChannelData(0);
  const N = Math.max(2, Math.round(sr/f)); const ring = new Float32Array(N);
  let seed = midi*9973; const rnd = () => { seed = (seed*16807) % 2147483647; return seed/2147483647*2-1; };
  for (let i=0;i<N;i++) ring[i] = rnd();
  // suavizado inicial (púa) y caída según la altura
  for (let p=0;p<2;p++) for (let i=0;i<N;i++) ring[i] = 0.5*(ring[i]+ring[(i+1)%N]);
  const decay = 0.996 - Math.max(0,(midi-40))*0.00006;
  let idx = 0, prev = 0;
  for (let i=0;i<d.length;i++){
    const a = ring[idx], b = ring[(idx+1)%N];
    const v = decay*0.5*(a+b);
    ring[idx] = v; d[i] = a; idx = (idx+1)%N;
  }
  // cuerpo: leve filtro y envolvente de ataque
  for (let i=0;i<d.length;i++){ const s = d[i]; d[i] = 0.62*s + 0.38*prev; prev = d[i]; }
  for (let i=0;i<Math.min(80,d.length);i++) d[i] *= i/80;
  return cache[midi] = buf;
}
function play(midi, when, gain=0.32){
  const ctx = ac(), src = ctx.createBufferSource(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  src.buffer = pluck(midi); lp.type='lowpass'; lp.frequency.value = 4200; g.gain.value = gain;
  src.connect(lp).connect(g).connect(ctx.destination); src.start(when);
  g.gain.setValueAtTime(gain, when+1.9); g.gain.exponentialRampToValueAtTime(0.0001, when+3.1); src.stop(when+3.15);
}

}

let UNLOCKED = false;
const LSg = (k,d)=>{ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } };
const LSs = (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
const b64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4)), c=>c.charCodeAt(0));
const b64n = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));
async function tryKey(raw){
  try{
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(ENC.iv)}, k, b64n(ENC.ct));
    const X = JSON.parse(new TextDecoder().decode(pt));
    Object.assign(D.v, X.dict.v); Object.assign(D.notes, X.dict.notes); Object.assign(KD.keys, X.keys);
    UNLOCKED = true; LSs('gc-k', toB64(raw)); return true;
  }catch(e){ return false; }
}
async function keyFrom(sid, tok){
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gc1|'+sid))).slice(0,16);
  const t = b64u(tok); return t.map((b,i)=>b^h[i]);
}
const isLocked = r => !UNLOCKED && r !== 'C';
function route(sid){
  if (!sid) return;
  sid = sid.replace(/([A-G])s$/, '$1#');
  if (sid==='tune') return showTab('T');
  if (sid==='app') return showTab('D');
  let m;
  if ((m=/^l-(\d+)$/.exec(sid))){ LES=m[1]; showTab('L'); renderLessons(); return; }
  if ((m=/^d-(.+)$/.exec(sid))){ if (D.roots.includes(m[1])){ root=m[1]; typ='maj'; sel=0; } showTab('D'); render(); return; }
  if ((m=/^k-(major|natural|harmonic|melodic|blues)-(.+)$/.exec(sid))){ kind=m[1]; tonic=m[2]; prog=0; showTab('P'); renderPlay(); return; }
}
async function handleCode(txt){
  let u = txt||''; try{ u=decodeURIComponent(u); }catch(e){}
  const m = /GC1\.([\w-]+)\.([\w-]{4,})/.exec(u) || /#([a-z]+(?:-[\w#]+)*)$/.exec(u);
  if (!m){ toast('This code is not from this book.'); return false; }
  const sid = m[1], tok = m[2];
  if (!ACT_CFG.open.includes(sid) && !UNLOCKED){
    if (!tok || !(await tryKey(await keyFrom(sid, tok)))){ toast('This code is not from this book.'); return false; }
    toast('All chords and keys are unlocked. Enjoy!');
  }
  try{ const k = JSON.parse(LSg('gc-codes','{}')); k[sid]=tok||''; LSs('gc-codes', JSON.stringify(k)); }catch(e){}
  stopPlay(); route(sid); return true;
}
function lockCard(what){
  return `<div class="lock"><h3>Unlock with your book</h3><p>${what} opens with the book. Scan any QR code on a key page or dictionary page of <b>Guitar Chords for Every Key</b>: you only need to do it once on this device.</p><button data-scan="1">Scan a code</button></div>`;
}

  try{ const t = readImage ? await readImage(url) : null; if (t) await (window.ACT_SCANNED||handleCode)(t); else toast('No code found. Hold the phone steady and fill the screen with the code.'); } finally { URL.revokeObjectURL(url); e.target.value=''; } };

const TUN = [['E','6th · low',40],['A','5th',45],['D','4th',50],['G','3rd',55],['B','2nd',59],['E','1st · high',64]];
let tunT = null;
function renderTune(){
  document.getElementById('tune').innerHTML = `<div class="card"><div class="title"><h2>Tune</h2><span>reference notes</span></div>
   <p class="notes" style="font-size:15px;line-height:1.45">Tap a string to hear its note. Turn the tuning peg slowly until your string sounds the same. Always tune <b>up</b> to the note.</p>
   <div class="strs">${TUN.map(([n,l],i)=>`<button data-tn="${i}">${n}<small>${l}</small></button>`).join('')}</div>
   <div class="hint">Each note repeats four times. Tap again to stop.</div></div>`;
}
function tuneNote(i){
  clearInterval(tunT); document.querySelectorAll('.strs button').forEach((b,j)=>b.classList.toggle('on', j===i));
  let n=0; const go=()=>{ play(TUN[i][2], ac().currentTime+0.02, 0.4); if(++n>=4){ clearInterval(tunT); document.querySelectorAll('.strs button').forEach(b=>b.classList.remove('on')); } };
  go(); tunT=setInterval(go, 1700);
}
function showTab(t){
  const map={D:'dict',P:'play',L:'less',T:'tune'};
  Object.entries(map).forEach(([k,id])=>{ document.getElementById(id).hidden = k!==t; document.getElementById('tab'+k).classList.toggle('on', k===t); });
  if (t!=='P') stopPlay();
  if (t==='L') renderLessons(); if (t==='T') renderTune(); if (t==='P') renderPlay(); if (t==='D') render();
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const tb = e.target.closest('#tabD,#tabP,#tabL,#tabT'); if (tb){ showTab(tb.id.slice(3)); return; }
  if (e.target.closest('[data-scan]')){ openScan(); return; }
  const li = e.target.closest('[data-li]'); if (li){ const c=LESSONS[LES].chords[+li.dataset.li]; document.querySelectorAll('#less .shape').forEach(x=>x.classList.toggle('on', x===li)); playVoicing(c.v, li.querySelector('svg'), 'both'); return; }
  const tn = e.target.closest('[data-tn]'); if (tn){ const i=+tn.dataset.tn; if (tn.classList.contains('on')){ clearInterval(tunT); tn.classList.remove('on'); } else tuneNote(i); return; }
}, true);

// ---------------- lectura de la foto del código, más robusta ----------------
// 1) el lector de códigos del propio sistema (Android/Chrome), si existe;
// 2) jsQR sobre la foto entera a varios tamaños (también más grande que antes);
// 3) jsQR por trozos a resolución completa: el código del libro es pequeño dentro de la foto de la página.
readImage = async function (src) {
  const img = new Image(); img.src = src; await img.decode();
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  try {
    if ('BarcodeDetector' in window) {
      const fm = await BarcodeDetector.getSupportedFormats(); if (fm.includes('qr_code')) {
        const r = await new BarcodeDetector({formats: ['qr_code']}).detect(img); if (r && r.length && r[0].rawValue) return r[0].rawValue; } }
  } catch (e) {}
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  const tryRect = (sx, sy, sw, sh, max, inv) => {
    const k = Math.min(max / Math.max(sw, sh), 3); const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
    cv.width = w; cv.height = h; cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: inv || 'dontInvert'}); return r && r.data; };
  const pause = () => new Promise(r => setTimeout(r, 0));
  for (const max of [1400, 900, 2000, 2800]) { const v = tryRect(0, 0, W, H, max); if (v) return v; await pause(); }
  for (const n of [2, 3]) {                       // trozos solapados: cada uno a ~1400 px
    const tw = W / n * 1.5, th = H / n * 1.5;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const sx = Math.max(0, Math.min(W - tw, (W - tw) * (n === 1 ? 0 : j / (n - 1)))), sy = Math.max(0, Math.min(H - th, (H - th) * (n === 1 ? 0 : i / (n - 1))));
      const v = tryRect(sx, sy, Math.min(tw, W), Math.min(th, H), 1400); if (v) return v; await pause(); } }
  for (const max of [1400, 900]) { const v = tryRect(0, 0, W, H, max, 'attemptBoth'); if (v) return v; }
  return null;
};


// ---------------- activación del libro (una sola vez por dispositivo) ----------------

// el código de una página concreta del libro, elegida al azar entre capítulos que no salen en la

(function () {

  let SRC = 'link';                                          // 'scan' solo cuando el código entra por el escáner de la app

    const wrong = src === 'scan' && sid !== st.ask.sid && !!st.shown; st.shown = true; LS.set(KEY, st); show(wrong); return false;
  };
  let ov = null;
  function close() { if (ov) { ov.remove(); ov = null; } }
  function show(wrong) {
    close(); const q = st.ask, dir = A.thumbs || 'act/', img = typeof q.img === 'string' ? q.img : q.img !== false ? dir + 'p' + String(q.page).padStart(3, '0') + '.jpg' : '';
    if (!document.getElementById('act-css')) { const s = document.createElement('style'); s.id = 'act-css';
      s.textContent =
        '#act-ov{position:fixed;inset:0;z-index:9998;background:rgba(8,7,6,.86);padding:14px;overflow:auto;display:flex}' +
        '#act-box{background:var(--panel,#1e1c19);color:var(--fg,#f2eadb);border:1px solid var(--line,#34302a);border-radius:20px;max-width:520px;width:100%;margin:auto;padding:22px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:var(--body,system-ui)}' +
        '#act-box .eb{font:700 12px/1 var(--body,system-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--accent,#c9a25a);text-align:center}' +
        '#act-box h2{font:700 34px/1 var(--display,system-ui);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 16px;text-align:center}#act-box h2 span{display:block;color:var(--accent,#c9a25a);font-size:64px;line-height:.95;margin-top:2px}' +
        '#act-wrong{background:#5a1f1a;color:#ffd9d2;border-radius:12px;padding:10px 12px;margin:0 0 14px;font-weight:700;text-align:center}' +
        '#act-vis{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:#15130f;border-radius:16px;padding:14px}' +
        '#act-th{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);background:#fff;aspect-ratio:621/810}' +
        '#act-th img{display:block;width:100%;height:100%}' +
        '#act-th i{position:absolute;border:3px solid var(--accent,#c9a25a);border-radius:5px;box-shadow:0 0 0 3px rgba(201,162,90,.35);animation:actp 1.4s ease-in-out infinite}' +
        '#act-th b{position:absolute;background:var(--accent,#c9a25a);color:#121110;font:700 10px/1 var(--body,system-ui);padding:4px 6px;border-radius:5px;white-space:nowrap}' +
        '@keyframes actp{50%{box-shadow:0 0 0 7px rgba(201,162,90,.15)}}' +
        '#act-pg small{display:block;color:var(--muted,#8f8676);font-size:14px;line-height:1.3}' +
        '#act-pg strong{display:block;font:700 34px/1 var(--display,system-ui);color:var(--fg,#f2eadb);text-transform:uppercase;margin:6px 0 4px}#act-pg .tip{margin-top:10px;color:var(--accent,#c9a25a)}' +
        '#act-steps{list-style:none;margin:16px 0 4px;padding:0;display:grid;gap:10px}' +
        '#act-steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-size:16px;line-height:1.35}' +
        '#act-steps li span{width:30px;height:30px;border-radius:50%;background:var(--accent,#c9a25a);color:#121110;font-weight:700;display:grid;place-items:center}' +
        '#act-box .go{display:flex;align-items:center;justify-content:center;gap:10px;font:700 19px/1 var(--body,system-ui);padding:17px;border-radius:14px;border:0;background:var(--accent,#c9a25a);color:#121110;width:100%;margin-top:16px;cursor:pointer}' +
        '#act-box .go svg{width:24px;height:24px;fill:currentColor}' +
        '#act-box .lnk{display:block;margin:8px auto 0;background:none;border:0;color:var(--muted,#8f8676);font:500 14px var(--body,system-ui);padding:8px;cursor:pointer}' +
        '#act-box .help{text-align:center;font-size:13px;color:var(--muted,#8f8676);margin:2px 0 0}' +
        '@media (max-width:420px){#act-box{padding:18px 14px 12px}#act-vis{grid-template-columns:118px 1fr;gap:12px;padding:12px}#act-pg strong{font-size:28px}#act-box h2{font-size:28px;margin-bottom:12px}#act-box h2 span{font-size:54px}#act-steps li{font-size:15px}}';
      document.head.appendChild(s); }
    const B = q.box || (A.boxes || {})[q.page] || [71.7, 16, 11, 8.5], U = A.unit || 'Chapter';
    const thumb = img ? '<div id="act-th"' + (A.aspect ? ' style="aspect-ratio:' + A.aspect + '"' : '') + '><img src="' + img + '" alt="Page ' + q.page + ' of your book" onerror="this.parentNode.style.display=\'none\'">' +
      '<i style="left:' + B[0] + '%;top:' + B[1] + '%;width:' + B[2] + '%;height:' + B[3] + '%"></i>' +
      '<b style="right:' + Math.max(3, 100 - B[0] - B[2]) + '%;top:' + (B[1] + B[3] + 2) + '%">SCAN THIS</b></div>' : '';
    ov = document.createElement('div'); ov.id = 'act-ov';
    ov.innerHTML = '<div id="act-box" role="dialog" aria-label="Activate your book">' +
      '<div class="eb">One-time step · Activate your book</div><h2>Now scan<span>page ' + q.page + '</span></h2>' +
      (wrong ? '<p id="act-wrong">That is a different code. Look for page ' + q.page + '.</p>' : '') +
      '<div id="act-vis">' + thumb + '<div id="act-pg"><small>Page ' + q.page + ' of your book:</small><strong>' + q.ch + '</strong><small>' + q.title + '</small><small class="tip">The code is near the top of the page.</small></div></div>' +
      '<ol id="act-steps"><li><span>1</span><div>Open the book at page ' + q.page + '.</div></li>' +
      '<li><span>2</span><div>Tap <b>Scan the code</b> below.</div></li>' +

      '<button type="button" class="lnk" data-a="later">Not now</button>' +

<script>
// ---------------- escáner con la cámara del ordenador ----------------
// Lee el código en directo con la cámara (la trasera en el móvil, la webcam en el ordenador), en cuanto aparece,
// como la cámara del sistema; si no hay cámara o se deniega el permiso, ofrece hacer o elegir una foto del código.
(function () {
  const CFG = window.CAMSCAN_CFG || {};
  const ua = navigator.userAgent || '';
  const phone = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const can = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && typeof jsQR === 'function';
  if (!can) return;
  const dbg = t => (window.CAMSCAN_DBG || (() => {}))(t);
  const fileInput = () => document.getElementById(CFG.input || 'cam');
  let ov = null, stream = null, raf = 0, busy = false;
  function css() {
    if (document.getElementById('cs-css')) return;
    const s = document.createElement('style'); s.id = 'cs-css';
    s.textContent = '#cs-ov{position:fixed;inset:0;z-index:9999;background:rgba(10,12,16,.92);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}' +
      '#cs-box{background:#fff;color:#1a1d24;border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}' +
      '#cs-box h2{margin:0 0 6px;font-size:20px}#cs-box p{margin:6px 0 12px;font-size:15px;line-height:1.4;color:#3a3f4a}' +
      '#cs-vw{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3}' +
      '#cs-vw video{width:100%;height:100%;object-fit:cover;' + (phone ? '' : 'transform:scaleX(-1);') + 'display:block}' +
      '#cs-vw i{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}' +
      '#cs-st{min-height:20px;font-size:14px;margin:10px 0 4px;color:#3a3f4a}' +
      '#cs-bt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}' +
      '#cs-bt button{font:inherit;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid #c9ced8;background:#f3f5f8;color:#1a1d24;cursor:pointer}' +
      '#cs-bt button.pri{background:#1a1d24;color:#fff;border-color:#1a1d24}';
    document.head.appendChild(s);
  }
  function close() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (ov) { ov.remove(); ov = null; }
  }
  function photo() { close(); const i = fileInput(); if (i) i.click(); }
  function status(t) { const e = document.getElementById('cs-st'); if (e) e.textContent = t; }
  async function open() {
    if (ov) return; css();
    ov = document.createElement('div'); ov.id = 'cs-ov';
    ov.innerHTML = '<div id="cs-box" role="dialog" aria-label="Scan a code"><h2>Scan a code</h2>' +
      '<p>' + (phone ? 'Point the camera at the code, inside the frame. It is read automatically.' : 'Hold the book in front of your computer’s camera, with the code inside the frame. Keep it still for a moment.') + '</p>' +
      '<div id="cs-vw"><video playsinline muted></video><i></i></div><div id="cs-st">Starting the camera…</div>' +
      '<div id="cs-bt"><button type="button" data-a="photo">' + (phone ? 'Take a photo instead' : 'Use a photo of the code') + '</button><button type="button" class="pri" data-a="close">Cancel</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { const a = e.target.closest('button') && e.target.closest('button').dataset.a; if (a === 'close') close(); else if (a === 'photo') photo(); else if (e.target === ov) close(); });
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
    const v = ov.querySelector('video');
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {width: {ideal: 1920}, height: {ideal: 1080}, facingMode: phone ? {ideal: 'environment'} : 'user'}});
    } catch (e) {
      status(e && e.name === 'NotAllowedError' ? 'The camera is blocked. Allow it in your browser (the camera icon in the address bar), or use a photo of the code.' : 'No camera was found on this computer. You can use a photo of the code instead.');
      const vw = document.getElementById('cs-vw'); if (vw) vw.style.display = 'none'; return;
    }
    if (!ov) { stream.getTracks().forEach(t => t.stop()); stream = null; return; }
    v.srcObject = stream; try { await v.play(); } catch (e) {}
    status('Looking for the code…'); dbg('camera on ' + v.videoWidth + 'x' + v.videoHeight);
    let BD = null; try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) BD = new BarcodeDetector({formats: ['qr_code']}); } catch (e) {}
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
    let last = 0, n = 0;
    const tick = async t => {
      if (!ov) return; raf = requestAnimationFrame(tick);
      if (busy || t - last < 120 || !v.videoWidth) return; last = t; n++;
      const W = v.videoWidth, H = v.videoHeight;
      // tres pasadas alternas: marco completo, centro ampliado y centro más ampliado
      // (la webcam da poco detalle: ampliar el centro suaviza el ruido y agranda los módulos del código)
      const P = [[0, 1, 1280], [0.2, 0.6, 1400], [0.3, 0.4, 1200]][n % 3];
      const sx = W * P[0], sy = H * P[0], sw = W * P[1], sh = H * P[1];
      const k = P[2] / Math.max(sw, sh); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
      cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
      cx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      let r = null; if (BD && n % 2) { busy = true; try { const d = await BD.detect(v); if (d && d.length && d[0].rawValue) r = {data: d[0].rawValue}; } catch (e) {} busy = false; if (!ov) return; }
      if (!r) try { r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, {inversionAttempts: 'dontInvert'}); } catch (e) {}
      if (r && r.data) {
        busy = true; status('Code found!');
        const data = r.data; close(); dbg('read: ' + data.slice(0, 60));
        try { await CFG.onCode(data); } finally { busy = false; }
      }
    };
    raf = requestAnimationFrame(tick);
  }
  document.addEventListener('click', e => {
    if (e.target.closest('input')) return;   // el clic que abre el selector de fotos (input dentro de la etiqueta)
    const b = e.target.closest(CFG.trigger || 'label[for="cam"]'); if (!b) return;
    e.preventDefault(); e.stopPropagation(); open();
  }, true);
  window.camScanOpen = open;
})();
</script>
